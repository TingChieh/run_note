<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>RunNote</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f4;
        color: #1e302b;
        font-family: system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #292725; color: #f2f0ee; }
      }
      main { text-align: center; padding: 24px; }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 12px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: #218538;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        font-style: italic;
      }
      p { margin: 0; opacity: 0.72; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">R</div>
      <p>正在连接 RunNote…</p>
    </main>
  </body>
</html>
