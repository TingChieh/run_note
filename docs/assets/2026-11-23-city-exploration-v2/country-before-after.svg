<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="城市探索全国尺度前后对比线框图">
  <defs>
    <style>
      .bg { fill: #f6f7f4; }
      .panel { fill: #ffffff; stroke: #e0e6da; stroke-width: 1.5; }
      .title { font: 700 18px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #202d23; }
      .sub { font: 500 13px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #5c695e; }
      .label { font: 600 12px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #202d23; }
      .pill-text { font: 600 11px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #14532d; }
      .pill-muted { font: 500 11px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #5c695e; }
      .num { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .bad-badge { fill: #fff1f1; stroke: #efc9cc; }
      .bad-text { font: 600 12px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #a52b32; }
      .good-badge { fill: #ecf7ef; stroke: #bcdcca; }
      .good-text { font: 600 12px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #176448; }
      .map-old { fill: #edf3ef; stroke: #d7e0db; }
      .map-new-sea { fill: #e8f0f4; stroke: #d4e0e6; }
      .land { fill: #fcfdfb; stroke: #d5ded8; stroke-width: 1; }
      .land-visited { fill: #e3f4e8; stroke: #b8dcc4; stroke-width: 1; }
      .prov-border { fill: none; stroke: #e0e7e2; stroke-width: 0.8; stroke-dasharray: 2 2; }
      .btn { fill: #ffffff; stroke: #d5ded8; stroke-width: 1; }
      .btn-active { fill: #cfeacd; stroke: #91aca0; stroke-width: 1; }
      .bubble-1 { fill: #4ca76a; stroke: #ffffff; stroke-width: 2; }
      .bubble-2 { fill: #227b49; stroke: #ffffff; stroke-width: 2; }
      .bubble-3 { fill: #105332; stroke: #ffffff; stroke-width: 2.2; }
      .bubble-nearby { fill: #ffffff; stroke: #17745c; stroke-width: 2.2; stroke-dasharray: 3 2; }
      .cluster { fill: #17745c; stroke: #ffffff; stroke-width: 2.5; }
      .cluster-ring { fill: rgba(23, 116, 92, 0.18); }
      .city-tag { fill: rgba(255, 255, 255, 0.92); stroke: #d8e2dc; stroke-width: 1; }
      .tooltip { fill: #ffffff; stroke: #cfd9d2; stroke-width: 1.2; filter: drop-shadow(0 6px 14px rgba(30,48,43,0.12)); }
    </style>
  </defs>

  <rect width="1200" height="620" class="bg" />

  <!-- Header -->
  <text x="32" y="38" class="title">全国尺度（zoom ≈ 3.8）现状 vs v2 设计方案对比</text>
  <text x="32" y="58" class="sub">解决“全国地图几乎空白”的两大成因：100 m / 1.6 km 亚像素多边形消隐 + 默认无轮廓底图 + 当年空网格过滤</text>

  <!-- LEFT: BEFORE (v1.4.0) -->
  <g transform="translate(32, 78)">
    <rect width="554" height="510" rx="20" class="panel" />
    <rect x="20" y="18" width="176" height="28" rx="14" class="bad-badge" />
    <text x="34" y="36" class="bad-text">现状 v1.4.0 · 几乎空白</text>
    <text x="210" y="36" class="sub">仅渲染 1.6 km 矩形 fill，无城市点与省界</text>

    <!-- Top filters bar -->
    <g transform="translate(20, 60)">
      <text x="0" y="18" class="label">全域</text>
      <rect x="330" y="0" width="90" height="28" rx="8" class="btn" />
      <text x="342" y="18" class="pill-muted">范围: 全域 ▾</text>
      <rect x="428" y="0" width="86" height="28" rx="8" class="btn" />
      <text x="440" y="18" class="pill-muted">年份: 2026 ▾</text>
    </g>

    <!-- Map Canvas (Blank #edf3ef) -->
    <g transform="translate(20, 102)">
      <rect width="514" height="304" rx="12" class="map-old" />
      <!-- Zoom control -->
      <rect x="476" y="12" width="26" height="52" rx="6" class="btn" />
      <text x="484" y="32" class="label">+</text>
      <line x1="476" y1="38" x2="502" y2="38" stroke="#e0e6da" />
      <text x="485" y="55" class="label">−</text>

      <!-- Subpixel specks (almost invisible!) -->
      <rect x="318" y="96" width="1.2" height="1.2" fill="#8dcc9c" opacity="0.65" />
      <rect x="372" y="168" width="1.2" height="1.2" fill="#4ca76a" opacity="0.65" />
      <rect x="235" y="176" width="1.2" height="1.2" fill="#8dcc9c" opacity="0.65" />
      <rect x="336" y="226" width="1.2" height="1.2" fill="#8dcc9c" opacity="0.65" />

      <!-- Callout annotations -->
      <g transform="translate(88, 72)">
        <rect width="338" height="154" rx="14" fill="rgba(255,255,255,0.86)" stroke="#efc9cc" stroke-dasharray="4 3" />
        <text x="169" y="32" text-anchor="middle" class="bad-text">实际效果：纯色底板上几乎看不到任何足迹</text>
        <text x="20" y="60" class="sub">1. 默认不加载底图与省界轮廓，背景是纯色 #edf3ef</text>
        <text x="20" y="84" class="sub">2. 1.6 km 区块在全国视野仅 0.2–0.3 px，被 WebGL 栅格化丢弃</text>
        <text x="20" y="108" class="sub">3. 默认锁定当年（2026），往年城市数据全部不显示</text>
        <text x="20" y="132" class="sub">4. 无城市气泡、无聚类、无名称标注、无点击下钻、无重置视野</text>
      </g>
    </g>

    <!-- Footer -->
    <g transform="translate(20, 418)">
      <text x="0" y="16" class="sub">聚合网格 · 每块 1600 m</text>
      <rect x="444" y="0" width="70" height="28" rx="14" class="btn" />
      <text x="462" y="18" class="label">图层</text>
    </g>

    <!-- Separate list note -->
    <g transform="translate(20, 460)">
      <rect width="514" height="34" rx="10" fill="#f6f7f4" stroke="#e0e6da" />
      <text x="14" y="21" class="sub">另外：“城市图鉴”独立成另一个页签，默认进入时完全没有地图</text>
    </g>
  </g>

  <!-- RIGHT: AFTER (v2 Design) -->
  <g transform="translate(614, 78)">
    <rect width="554" height="510" rx="20" class="panel" />
    <rect x="20" y="18" width="194" height="28" rx="14" class="good-badge" />
    <text x="34" y="36" class="good-text">方案 v2 · 分层清晰可下钻</text>
    <text x="226" y="36" class="sub">离线轮廓 + 聚类气泡 + 标签避让</text>

    <!-- Top controls bar -->
    <g transform="translate(20, 60)">
      <!-- Segmented Mode -->
      <rect x="0" y="0" width="144" height="28" rx="14" fill="#ecebe7" />
      <rect x="3" y="3" width="68" height="22" rx="11" class="btn-active" />
      <text x="37" y="18" text-anchor="middle" class="pill-text">覆盖热图</text>
      <text x="106" y="18" text-anchor="middle" class="pill-muted">首次探索</text>

      <!-- Year & Scope -->
      <rect x="156" y="0" width="96" height="28" rx="8" class="btn" />
      <text x="168" y="18" class="label">全部年份 ▾</text>
      <rect x="260" y="0" width="128" height="28" rx="8" class="btn" />
      <text x="272" y="18" class="label">范围: 全国(12城) ▾</text>
      <rect x="396" y="0" width="118" height="28" rx="14" class="btn" />
      <text x="412" y="18" class="pill-text">⌖ 回到全域视角</text>
    </g>

    <!-- Map Canvas (Offline world-base + China provinces + clusters + bubbles) -->
    <g transform="translate(20, 102)">
      <rect width="514" height="304" rx="12" class="map-new-sea" />

      <!-- Schematic landmass & China provinces -->
      <path d="M 38,52 L 118,32 L 210,44 L 285,22 L 368,26 L 418,58 L 410,104 L 385,126 L 395,168 L 368,224 L 315,264 L 254,268 L 195,244 L 135,232 L 72,188 L 44,126 Z" class="land" />
      <!-- Visited provinces soft tint -->
      <path d="M 294,74 L 336,70 L 344,106 L 300,112 Z" class="land-visited" />
      <path d="M 332,140 L 384,136 L 390,182 L 340,186 Z" class="land-visited" />
      <path d="M 190,152 L 254,148 L 262,202 L 198,204 Z" class="land-visited" />
      <path d="M 298,214 L 352,212 L 358,250 L 302,248 Z" class="land-visited" />
      <path d="M 110,92 L 176,84 L 210,148 L 124,162 Z" class="prov-border" />
      <path d="M 210,44 L 285,22 L 298,112 L 210,148 Z" class="prov-border" />
      <path d="M 254,148 L 332,140 L 340,214 L 262,202 Z" class="prov-border" />

      <!-- Zoom controls + Layer button -->
      <rect x="476" y="12" width="26" height="52" rx="6" class="btn" />
      <text x="484" y="32" class="label">+</text>
      <line x1="476" y1="38" x2="502" y2="38" stroke="#e0e6da" />
      <text x="485" y="55" class="label">−</text>

      <!-- City bubbles & Cluster -->
      <!-- Beijing (high count) -->
      <circle cx="316" cy="92" r="12" class="bubble-3" />
      <text x="316" y="96" text-anchor="middle" fill="#ffffff" class="num">28</text>
      <rect x="332" y="81" width="54" height="20" rx="6" class="city-tag" />
      <text x="359" y="95" text-anchor="middle" class="label">北京市</text>

      <!-- Chengdu (medium) -->
      <circle cx="224" cy="176" r="9.5" class="bubble-2" />
      <text x="224" y="180" text-anchor="middle" fill="#ffffff" class="num">15</text>
      <rect x="158" y="166" width="54" height="20" rx="6" class="city-tag" />
      <text x="185" y="180" text-anchor="middle" class="label">成都市</text>

      <!-- Yangtze Delta Cluster (dense cities) -->
      <circle cx="370" cy="164" r="22" class="cluster-ring" />
      <circle cx="370" cy="164" r="15" class="cluster" />
      <text x="370" y="168" text-anchor="middle" fill="#ffffff" class="num">4城</text>
      <rect x="390" y="154" width="82" height="20" rx="6" class="city-tag" />
      <text x="431" y="168" text-anchor="middle" class="label">长三角 · 61</text>

      <!-- Shenzhen (boundary) -->
      <circle cx="332" cy="236" r="10.5" class="bubble-2" />
      <text x="332" y="240" text-anchor="middle" fill="#ffffff" class="num">19</text>
      <rect x="346" y="226" width="54" height="20" rx="6" class="city-tag" />
      <text x="373" y="240" text-anchor="middle" class="label">深圳市</text>

      <!-- Nearby point city (hollow dashed ring) -->
      <circle cx="148" cy="126" r="7" class="bubble-nearby" />
      <rect x="160" y="116" width="84" height="20" rx="6" class="city-tag" />
      <text x="202" y="130" text-anchor="middle" class="pill-muted">乌鲁木齐(附近)</text>

      <!-- Hover / Tap Preview Tooltip -->
      <g transform="translate(214, 18)">
        <rect width="194" height="52" rx="10" class="tooltip" />
        <text x="12" y="20" class="label">北京市 · 28 条活动</text>
        <text x="12" y="38" class="sub">168.5 km · 首跑 2024-03 · 点击下钻 →</text>
      </g>

      <!-- Scale indicator badge bottom-left -->
      <rect x="12" y="268" width="166" height="24" rx="12" fill="rgba(255,255,255,0.9)" stroke="#d5ded8" />
      <text x="22" y="284" class="pill-muted">全国概览 · 城市聚合（z3.8）</text>
    </g>

    <!-- Legend & Basemap Footer -->
    <g transform="translate(20, 418)">
      <circle cx="6" cy="12" r="5" fill="#4ca76a" />
      <text x="16" y="16" class="sub">跑过边界</text>
      <circle cx="84" cy="12" r="5" fill="#ffffff" stroke="#17745c" stroke-width="1.5" stroke-dasharray="2 1.5" />
      <text x="94" y="16" class="sub">附近有记录</text>
      <circle cx="176" cy="12" r="6" fill="#17745c" />
      <text x="187" y="16" class="sub">聚落（点击展开）</text>
      <rect x="444" y="0" width="70" height="28" rx="14" class="btn" />
      <text x="462" y="18" class="label">图层</text>
    </g>

    <!-- Unified IA note -->
    <g transform="translate(20, 460)">
      <rect width="514" height="34" rx="10" fill="#ecf7ef" stroke="#bcdcca" />
      <text x="14" y="21" class="good-text">下方/右侧同步联动“城市图鉴”列表与年度趋势，点击城市任意处皆可双向定位下钻</text>
    </g>
  </g>

  <text x="32" y="608" class="pill-muted">注：线框图为合成示例数据（非真实个人轨迹），严格复用现有暖浅色设计令牌（#f6f7f4 / #ffffff / #17745c）与零外部请求默认策略。</text>
</svg>
