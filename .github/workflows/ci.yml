name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to the commit their existing major tag pointed to when this file
# was written (resolved through the GitHub API); the tag is kept in the comment. Move them
# deliberately, e.g. with Dependabot, not implicitly.
jobs:
  backend:
    name: backend (Linux, PostgreSQL 18 + PostGIS)
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      # A disposable native cluster with loopback-only trust; never use for deployment.
      DATABASE_URL: postgresql+psycopg://run_note@127.0.0.1:55432/run_note_ci
      TEST_DATABASE_URL: postgresql+psycopg://run_note@127.0.0.1:55432/run_note_test
      TEST_DATABASE_ALLOWED_TARGETS: 127.0.0.1:55432/run_note_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL 18 + PostGIS from the PGDG apt repository
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-18-postgis-3
          /usr/lib/postgresql/18/bin/pg_config --version
          dpkg -l postgresql-18 postgresql-18-postgis-3 | tail -2
      - name: Start an isolated cluster
        run: |
          pg_bin=/usr/lib/postgresql/18/bin
          "$pg_bin/initdb" -D "$RUNNER_TEMP/run-note-pg" -U run_note -A trust --no-locale -E UTF8
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/run-note-pg" -l "$RUNNER_TEMP/run-note-pg.log" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP" -w start
          "$pg_bin/createdb" -h 127.0.0.1 -p 55432 -U run_note run_note_ci
          "$pg_bin/createdb" -h 127.0.0.1 -p 55432 -U run_note run_note_test
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements.lock
      # Most integration modules assume an already-migrated isolated test database (README
      # "测试环境"); only tests/integration/test_auth.py and test_migrations.py migrate for
      # themselves. Prepare exactly the allow-listed *_test database, never DATABASE_URL.
      - name: Migrate the isolated test database to head
        run: DATABASE_URL="$TEST_DATABASE_URL" .venv/bin/alembic upgrade head
      - run: .venv/bin/ruff check app migrations tests
      - run: .venv/bin/ruff format --check app migrations tests
      - run: .venv/bin/pytest -q --junitxml="$RUNNER_TEMP/junit.xml"
      - name: Annotate failing and slowest tests (diagnostics only)
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/junit.xml" ] || exit 0
          python ../.github/scripts/annotate_failures.py junit "$RUNNER_TEMP/junit.xml"
          python ../.github/scripts/annotate_failures.py slow "$RUNNER_TEMP/junit.xml" 12
      - name: Stop isolated test cluster
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/run-note-pg/postmaster.pid" ]; then
            /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/run-note-pg" -m fast -w stop
          fi

  # Developers work on macOS: keep one run of the same suite there, but only for main.
  backend-macos:
    name: backend (macOS parity, main only)
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://run_note@127.0.0.1:55432/run_note_ci
      TEST_DATABASE_URL: postgresql+psycopg://run_note@127.0.0.1:55432/run_note_test
      TEST_DATABASE_ALLOWED_TARGETS: 127.0.0.1:55432/run_note_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Start isolated native PostgreSQL/PostGIS
        run: |
          brew install postgresql@18 postgis
          pg_bin="$(brew --prefix postgresql@18)/bin"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/run-note-pg" -U run_note -A trust --no-locale -E UTF8
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/run-note-pg" -l "$RUNNER_TEMP/run-note-pg.log" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP" -w start
          "$pg_bin/createdb" -h 127.0.0.1 -p 55432 -U run_note run_note_ci
          "$pg_bin/createdb" -h 127.0.0.1 -p 55432 -U run_note run_note_test
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements.lock
      - name: Migrate the isolated test database to head
        run: DATABASE_URL="$TEST_DATABASE_URL" .venv/bin/alembic upgrade head
      - run: .venv/bin/pytest -q
      - name: Stop isolated test cluster
        if: always()
        run: |
          pg_bin="$(brew --prefix postgresql@18)/bin"
          if [ -f "$RUNNER_TEMP/run-note-pg/postmaster.pid" ]; then
            "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/run-note-pg" -m fast -w stop
          fi

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build

  # Synthetic-API browser tests (no backend, no database). Chrome is preinstalled on the runner.
  frontend-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      # `github` reporter adds per-failure annotations (readable without log access).
      - run: pnpm exec playwright test --config playwright.ui.config.ts --reporter=list,github
      - name: Probe UI failures on this runner (diagnostics only)
        if: failure()
        run: |
          for mode in tracks heatmap; do
            if [ -f "test-results/city-$mode-restored.png" ]; then
              result="$(python3 ../.github/scripts/png_diff.py "test-results/city-$mode-before.png" "test-results/city-$mode-restored.png" 2>&1 || true)"
              echo "::notice title=map screenshot diff ($mode)::$result"
            fi
          done
          python3 ../.github/scripts/ui_diagnostics.py
          pnpm exec playwright test --config playwright.ci-diagnostics.config.ts -g "nested month|city locator|official button" --reporter=list || true
      - name: Keep Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-ui-results
          path: frontend/test-results
          retention-days: 7

  # Everything under infra/native: static checks, ops unit tests, release packaging and a full
  # deploy/migrate/rollback/restore rehearsal against a throw-away cluster. Nothing here talks to
  # a real server.
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: shellcheck
        run: shellcheck -x --source-path=SCRIPTDIR infra/native/ops/*.sh infra/native/tests/*.sh
      - name: Backend virtualenv (also used by the ops unit tests)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --require-hashes -r backend/requirements.lock
      - name: Ops unit tests (env parsing, production Settings check, schema relation)
        run: backend/.venv/bin/python -m unittest discover -s infra/native/tests -v
      - name: Validate the Caddyfile
        run: |
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update && sudo apt-get install -y caddy
          RUNNOTE_DOMAIN=run.example.test caddy validate --config infra/native/Caddyfile --adapter caddyfile
      - name: Verify systemd units
        run: |
          sudo useradd --system runnote || true
          sudo useradd --system postgres || true
          sudo install -d /etc/run-note /opt/run-note/current/backend/.venv/bin /opt/run-note/current/frontend /opt/run-note/current/ops /var/backups/run-note
          for f in backend frontend backup; do sudo touch /etc/run-note/$f.env; done
          sudo touch /opt/run-note/current/backend/.venv/bin/uvicorn /opt/run-note/current/ops/backup.sh
          sudo chmod +x /opt/run-note/current/backend/.venv/bin/uvicorn /opt/run-note/current/ops/backup.sh
          sudo cp infra/native/runnote-*.service infra/native/runnote-*.timer /etc/systemd/system/
          if ! systemd-analyze verify /etc/systemd/system/runnote-api.service /etc/systemd/system/runnote-web.service /etc/systemd/system/runnote-backup.service /etc/systemd/system/runnote-backup.timer > "$RUNNER_TEMP/verify.log" 2>&1; then
            cat "$RUNNER_TEMP/verify.log"
            python .github/scripts/annotate_failures.py tail "$RUNNER_TEMP/verify.log" 40
            exit 1
          fi
          cat "$RUNNER_TEMP/verify.log"
      - name: Install PostgreSQL 18 + PostGIS
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-18-postgis-3
      - name: Build the release tarball
        run: |
          pnpm --dir frontend install --frozen-lockfile
          infra/native/ops/build-release.sh --out "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/release.path"
          tar -tzf "$(tail -1 "$RUNNER_TEMP/release.path")" | grep -E '/(RELEASE|ops/deploy.sh|backend/requirements.lock|frontend/build/index.js)$'
      - name: Deploy / migrate / rollback / restore rehearsal
        env:
          PG_BIN: /usr/lib/postgresql/18/bin
          PYTHON: python
        run: |
          set -o pipefail
          infra/native/tests/ops-e2e.sh "$(tail -1 "$RUNNER_TEMP/release.path")" 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - name: Annotate rehearsal failure (diagnostics only)
        if: failure()
        run: '[ ! -f "$RUNNER_TEMP/e2e.log" ] || python .github/scripts/annotate_failures.py tail "$RUNNER_TEMP/e2e.log" 60'
      - name: Keep the release tarball for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release/
          retention-days: 7
