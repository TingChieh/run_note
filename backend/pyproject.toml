[project]
name = "run-note-backend"
version = "0.1.0"
description = "Run Note phase-one API infrastructure"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "gpxpy==1.6.2",
  "defusedxml==0.7.1",
  "argon2-cffi==25.1.0",
  "GeoAlchemy2==0.21.0",
  "python-multipart==0.0.33",
  "email-validator==2.4.0",
  "Pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx2==2.16.0", "ruff==0.17.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a separate PostgreSQL/PostGIS database"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
