[project]
name = "run-note-backend"
version = "0.1.0"
description = "Run Note phase-one API infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.1.4",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "gpxpy==1.6.2",
  "defusedxml==0.7.1",
  "argon2-cffi==25.1.0",
  "GeoAlchemy2==0.20.0",
  "python-multipart==0.0.32",
  "email-validator==2.3.0",
  "Pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx2==2.13.1", "ruff==0.17.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a separate PostgreSQL/PostGIS database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
